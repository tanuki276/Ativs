}

android {
    namespace 'com.tanuki276.ativs'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId 'com.tanuki276.ativs'
        minSdk 26
        targetSdk 35
